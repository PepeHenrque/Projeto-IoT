<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>CampusSmart | Sala 101</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <div class="brand-mark">ϟ</div>
      <strong>CampusSmart</strong>
      <span class="conn" id="connPill" data-state="connecting" role="status"><i></i><span id="connText">Conectando…</span></span>
    </header>

    <!-- Área onde o roteador monta cada tela (js/views) -->
    <div id="view" class="page" tabindex="-1"></div>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="nav-item active" data-nav="inicio" href="#/inicio"><span aria-hidden="true">▦</span>Início</a>
      <a class="nav-item" data-nav="controle" href="#/controle"><span aria-hidden="true">⚙</span>Controle</a>
      <a class="nav-item" data-nav="alertas" href="#/alertas"><span class="alert-icon" aria-hidden="true">△<em id="navAlertCount" hidden>0</em></span>Alertas</a>
      <a class="nav-item" data-nav="historico" href="#/historico"><span aria-hidden="true">◷</span>Histórico</a>
    </nav>
  </main>

  <!-- Modal único: confirmação, carregando, sucesso e erro -->
  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
      <div class="modal-symbol" id="modalSymbol" aria-hidden="true">!</div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  
  <script src="js/config.js"></script>
  <script src="js/services/http.js"></script>
  <script src="js/data/roomProfile.js"></script>
  <script src="js/services/campusApi.js"></script>
  <script src="js/services/historyService.js"></script>
  <script src="js/core/alerts.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/selectors.js"></script>
  <script src="js/core/telemetry.js"></script>
  <script src="js/ui/html.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/core/actions.js"></script>
  <script src="js/views/shared.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/control.js"></script>
  <script src="js/views/alerts.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/dev/mockServer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
